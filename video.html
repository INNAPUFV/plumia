<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PlumIA · vídeo</title>
<style>html,body{margin:0;height:100%;background:#393836}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
p{color:#fff;font-family:Arial,sans-serif;padding:16px}</style></head>
<body><script>
const id=(new URLSearchParams(location.search).get('v')||'').trim();
if(/^[A-Za-z0-9_-]{11}$/.test(id)){
  const f=document.createElement('iframe');
  f.src='https://www.youtube-nocookie.com/embed/'+id+'?rel=0&playsinline=1&origin='+encodeURIComponent(location.origin);
  f.title='Vídeo'; f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true;
  f.referrerPolicy='strict-origin-when-cross-origin'; document.body.appendChild(f);
} else document.body.innerHTML='<p>Vídeo no válido.</p>';
</script></body></html>
